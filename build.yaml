overview: "Page thumbnails on the comic detail page, click one to open the reader at that page"
description: >
  Shows thumbnails of the pages of a comic (.cbz, .cbr, .cb7, .cbt) on its detail page, below the people.
  Thumbnails are loaded page by page, so large comics stay fast, and are cached on the server.
  Clicking a thumbnail opens Jellyfin's comic reader directly at that page.
